name: desktop_app
description: Windows POS & Retail ERP for Beauty, Bridal & Fashion Jewellery
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  core_models:
    path: ../../packages/core_models
  api_client:
    path: ../../packages/api_client
  auth:
    path: ../../packages/auth
  permissions:
    path: ../../packages/permissions
  ui_components:
    path: ../../packages/ui_components
  intl: ^0.19.0
  uuid: ^4.3.3
  printing: ^5.13.1
  pdf: ^3.10.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
